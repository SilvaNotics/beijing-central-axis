<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="北京中轴线南段互动地图，包含天安门、正阳门、天坛、先农坛、道路遗存与永定门的故事、配音和影像。">
<title>京华入墨 · 中轴拾光</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./roaming.css">
<link rel="stylesheet" href="./opening.css">
</head>
<body>
<main class="page">
  <header>
    <div>
      <div class="kicker">一卷京华 · 入墨成诗</div>
      <h1>京华入墨 · 中轴拾光</h1>
      <div class="hint">循一线京华，听六处风物。与画中人相逢。</div>
    </div>
    <a class="chapter-return" data-return href="../../#/">← 返回中轴总览</a>
    <div class="progress" aria-live="polite">
      已游览 <strong id="progress">0 / 6</strong>
    </div>
  </header>

  <div class="tools">
    <button class="btn" id="musicToggleHome" type="button" aria-pressed="true">音乐：开</button>
    <button class="btn" id="reset" type="button">重置进度</button>
  </div>

  <section class="map" aria-label="北京中轴线互动地图">
    <img id="mapImage" alt="北京中轴线水墨地图" hidden>
    <div class="empty-map" id="mapEmpty">
      <h2>展开一卷京华</h2>
      <p>地图尚未载入。也可以直接使用下方景点入口。</p>
    </div>
    <div class="hotspots" id="hotspots" hidden></div>
  </section>

  <nav class="destinations" id="destinations" aria-label="景点入口"></nav>
  <p class="status" id="pageStatus" role="status"></p>
</main>

<dialog id="story" aria-labelledby="storyTitle">
  <section class="stage" id="stage">
    <div class="background" id="background" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>

    <svg class="landscape" viewBox="0 0 1400 700"
         preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="landBlur"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <g fill="#687b68" filter="url(#landBlur)">
        <path opacity=".45"
          d="M0 450 100 310 170 360 280 150 370 330 450 280 580 460
          700 380 820 440 970 180 1080 350 1220 230 1400 420V700H0Z"/>
        <path opacity=".35"
          d="M0 550 170 420 260 480 410 340 530 510 670 410
          790 530 940 380 1100 510 1250 390 1400 540V700H0Z"/>
      </g>
    </svg>

    <div class="scene-top">
      <div class="location">
        <small>中轴拾光 · 入画相逢</small>
        <h2 id="storyTitle">景点故事</h2>
      </div>
      <div class="scene-tools">
        <button id="musicToggle" type="button" aria-pressed="true">音乐：开</button>
        <button id="settingsToggle" type="button" aria-expanded="false">声音设置</button>
        <button id="openVideo" type="button">看视频</button>
        <button id="closeStory" type="button">返回地图</button>
      </div>
    </div>

    <aside class="settings" id="settings" aria-label="声音设置" hidden>
      <h3>听风 · 听人语</h3>
      <label><input id="autoRead" type="checkbox" checked> 自动朗读对话</label>
      <label>朗读方式
        <select id="voiceMode" aria-label="选择朗读方式">
          <option value="cast">人物配音</option>
          <option value="system">系统语音</option>
        </select>
      </label>
      <label>系统声音
        <select id="voiceSelect" aria-label="选择系统朗读声音"></select>
      </label>
      <label>朗读速度 <span id="rateLabel">1.00</span>
        <input id="readRate" type="range" min="0.65" max="1.2"
               step="0.05" value="1">
      </label>
      <label>音乐音量
        <input id="musicVolume" type="range" min="0" max="0.5"
               step="0.01" value="0.16">
      </label>
      <p class="hint">人物配音使用本地音频；修订后的台词和缺少配音的句子使用系统语音。
      系统朗读取决于设备可用的中文声音。背景音乐可通过上方按钮关闭。</p>
      <button class="btn" id="closeSettings" type="button">收起设置</button>
    </aside>

    <div class="poem" id="poem" aria-hidden="true"></div>
    <div class="seal" aria-hidden="true">京华拾光</div>

    <div class="cast">
      <img class="portrait" id="portrait" alt="" hidden>
    </div>

    <div class="texture" aria-hidden="true"></div>

    <div class="dialogue">
      <!-- 只让背景晕染，不扭曲文字和按钮 -->
      <svg class="paper-art" viewBox="0 0 1200 300"
           preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="paperEdge" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency=".018 .055"
                          numOctaves="3" seed="23" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise"
                               scale="17" xChannelSelector="R"
                               yChannelSelector="G"/>
          </filter>
          <filter id="inkBloom" x="-15%" y="-30%" width="130%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency=".014 .043"
                          numOctaves="3" seed="16" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise"
                               scale="23"/>
            <feGaussianBlur stdDeviation="5"/>
          </filter>
          <linearGradient id="paperColor" x1="0" x2="1">
            <stop stop-color="#ece3c9" stop-opacity=".95"/>
            <stop offset=".2" stop-color="#fcf5e5" stop-opacity=".97"/>
            <stop offset=".72" stop-color="#faf3e1" stop-opacity=".97"/>
            <stop offset="1" stop-color="#e8dfc6" stop-opacity=".94"/>
          </linearGradient>
          <radialGradient id="inkStain">
            <stop stop-color="#78816b" stop-opacity=".17"/>
            <stop offset="1" stop-color="#78816b" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <path d="M57 30Q220 12 417 24T804 21Q1032 10 1146 34
                 Q1182 64 1160 136Q1185 233 1137 266
                 Q968 289 744 273T365 280Q155 290 45 260
                 Q18 204 35 153Q15 74 57 30Z"
              fill="#7b8063" opacity=".24" filter="url(#inkBloom)"/>

        <path d="M58 30Q220 12 417 24T804 21Q1032 10 1146 34
                 Q1182 64 1160 136Q1185 233 1137 266
                 Q968 289 744 273T365 280Q155 290 45 260
                 Q18 204 35 153Q15 74 58 30Z"
              fill="url(#paperColor)" filter="url(#paperEdge)"/>

        <ellipse cx="110" cy="58" rx="190" ry="75" fill="url(#inkStain)"/>
        <ellipse cx="1090" cy="235" rx="210" ry="90" fill="url(#inkStain)"/>

        <g fill="none" stroke-linecap="round" filter="url(#paperEdge)">
          <path d="M77 34Q280 19 467 32M524 30Q843 18 1119 39"
                stroke="#70765c" stroke-opacity=".27" stroke-width="2.8"/>
          <path d="M51 59Q28 121 44 170M42 195Q36 243 76 259"
                stroke="#697157" stroke-opacity=".31" stroke-width="3"/>
          <path d="M1144 58Q1166 100 1153 157M1157 187Q1171 244 1120 261"
                stroke="#6b7358" stroke-opacity=".25" stroke-width="3.3"/>
          <path d="M94 267Q307 284 502 267M608 272Q916 287 1105 267"
                stroke="#6b7056" stroke-opacity=".28" stroke-width="2.5"/>
        </g>

        <g fill="#74795e" opacity=".11">
          <ellipse cx="55" cy="80" rx="13" ry="4"/>
          <ellipse cx="1128" cy="265" rx="19" ry="5"/>
          <ellipse cx="186" cy="25" rx="29" ry="3"/>
          <circle cx="1151" cy="238" r="4"/>
          <circle cx="69" cy="250" r="3"/>
        </g>
      </svg>

      <svg class="bamboo" viewBox="0 0 200 140" aria-hidden="true">
        <g fill="none" stroke="#4b6148" stroke-linecap="round">
          <path d="M186 135Q145 60 110 5" stroke-width="3"/>
          <path d="M150 77 84 47M164 101 104 95M129 37 171 20"
                stroke-width="1.5"/>
        </g>
        <g fill="#485e44">
          <path d="M142 70Q91 4 96 47Q114 70 142 70Z"/>
          <path d="M130 63Q61 27 79 58Q106 69 130 63Z"/>
          <path d="M147 83Q96 57 105 89Q126 97 147 83Z"/>
          <path d="M165 102Q119 85 126 114Q146 119 165 102Z"/>
          <path d="M135 43Q172 1 174 25Q158 45 135 43Z"/>
          <path d="M157 89Q194 47 196 70Q184 91 157 89Z"/>
        </g>
      </svg>

      <div class="dialogue-content">
        <div class="speaker" id="speaker"></div>
        <p class="speech" id="speech" aria-live="polite"></p>
        <div class="dialogue-bottom">
          <div class="reading-info">
            <span id="lineCount"></span><br>
            <span id="readStatus" role="status"></span>
          </div>
          <div class="actions">
            <button class="ink-btn" id="readButton" type="button">重听本句</button>
            <button class="ink-btn" id="previous" type="button">上一句</button>
            <button class="ink-btn next" id="next" type="button">继续 ▸</button>
          </div>
        </div>
      </div>
    </div>

    <div class="disclaimer">虚构导览人物 · 创作叙事</div>
  </section>

  <section class="video-view" id="videoView" aria-label="景点视频" hidden>
    <div class="video-head">
      <h2 id="videoTitle">景点视频</h2>
      <div class="tools">
        <button class="btn" id="backToTalk" type="button">返回对话</button>
        <button class="btn" id="closeVideo" type="button">返回地图</button>
      </div>
    </div>
    <video id="player" controls playsinline preload="metadata" hidden></video>
    <div class="video-empty" id="videoEmpty">
      <h3 id="emptyTitle">请添加视频</h3>
      <p id="emptyText"></p>
    </div>
    <p class="hint" id="videoStatus" role="status"></p>
  </section>
</dialog>

<script src="./app.js" defer></script>
<script src="./roaming.js" defer></script>
<script src="./opening.js" defer></script>
</body>
</html>
